# 羽球集 - 本地开发环境
# 用法：docker-compose up -d

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: yuqiuji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: yuqiuji_dev_2024
      MYSQL_DATABASE: yuqiuji
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: yuqiuji-server
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PORT: 8080
      MYSQL_DSN: "root:yuqiuji_dev_2024@tcp(mysql:3306)/yuqiuji?charset=utf8mb4&parseTime=True&loc=Local"
      WX_APP_ID: "${WX_APP_ID:-}"
      WX_APP_SECRET: "${WX_APP_SECRET:-}"
      JWT_SECRET: "${JWT_SECRET:-yuqiuji-jwt-secret-2024}"
    ports:
      - "8080:8080"

volumes:
  mysql_data:
